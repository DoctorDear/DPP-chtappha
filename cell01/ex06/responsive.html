<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Responsive</title>
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            table {
                width: 100%;
                height: 100%;
                border: 1px solid black;
                border-collapse: collapse;
            }
            td {
                width: 50%;
                font-family: monospace;
                justify-content: center;
                text-align: center;
                font-size: 2rem;
            }
        </style>
    </head>

    <body>
        <table>
            <tr>
                <td style="background: #8ba245">col1</td>
                <td style="background: pink">col2</td>
            </tr>
        </table>
    </body>
</html>
