<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>User Profile Card</title>
        <link rel="stylesheet" href="card.css" />
    </head>
    <body>
        <h1>User Profile Card</h1>
        <div class="card-container">
            <div class="card-img">
                <img
                    src="https://images.ctfassets.net/gy95mqeyjg28/5lfeRpUNRvMczfjDhqMABS/4e198046d0db15ef3611accaab2bd23f/2026_McL_web_driver_page_header_Oscar.jpg?w=1920&q=75&fm=webp&fit=fill"
                    alt="Oscar Piastri"
                />
            </div>
            <div class="card-content">
                <h2>Oscar Piastri</h2>
                <p class="card-profile-desc">F1 Driver, McLaren</p>
                <p>McLaren F1 Team</p>
                <div class="card-social">
                    <a href="https://www.mclaren.com/racing/team/oscar-piastri/"
                        ><img src="./facebook.png" alt="Facebook Icon"
                    /></a>
                    <a href="https://www.mclaren.com/racing/team/oscar-piastri/"
                        ><img src="./instagram.png" alt="Facebook Icon"
                    /></a>
                    <a href="https://www.mclaren.com/racing/team/oscar-piastri/"
                        ><img src="./linkedin.png" alt="Facebook Icon"
                    /></a>
                </div>
            </div>
            <div class="card-contact">
                <a
                    class="contact-button"
                    href="https://www.mclaren.com/racing/team/oscar-piastri/"
                    >Contact</a
                >
            </div>
        </div>
    </body>
</html>
